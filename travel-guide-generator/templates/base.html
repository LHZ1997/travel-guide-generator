<body class="{% block body_class %}{% endblock %}">



<nav class="navbar">
    <div class="nav-brand">
        <svg><use href="#icon-map"/></svg>
        <span>攻略生成器</span>
    </div>
    <div class="nav-right">
        <div class="nav-links">
            <a href="/">聊天</a>
            <a href="/agents">智能体</a>
            <a href="/orchestration">编排</a>
            <a href="/config">配置</a>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" title="切换主题">
            <svg id="themeIconSvg"><use href="#icon-moon"/></svg>
        </button>
    </div>
</nav>



<main class="container">
{% block content %}{% endblock %}
</main>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/javascript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/bash.min.js"></script>
<script>
(function() {
  const saved = localStorage.getItem('theme');
  if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (isDark) {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('theme', 'light');
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem('theme', 'dark');
  }
  const icon = document.getElementById('themeIconSvg');
  if (icon) {
    const use = icon.querySelector('use');
    if (use) use.setAttribute('href', isDark ? '#icon-moon' : '#icon-sun');
  }
}
// Update icon on load
(function() {
  const icon = document.getElementById('themeIconSvg');
  if (icon) {
    const use = icon.querySelector('use');
    if (use) use.setAttribute('href', document.documentElement.getAttribute('data-theme') === 'dark' ? '#icon-sun' : '#icon-moon');
  }
})();
</script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
